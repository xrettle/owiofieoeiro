name: 'Add Streak Freezes'
run-name: 'Add Duolingo Streak Freezes'

on:
  workflow_dispatch:
    inputs:
      amount:
        description: 'Number of streak freezes to add (default: 2)'
        required: false
        default: '2'
        type: string

jobs:
  add-freezes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Add streak freezes
        run: node streak-freeze.js
        env:
          FREEZES: ${{ github.event.inputs.amount || '2' }}
          TOKEN: ${{ secrets.TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
