name: 'Duolingo Streak Reviver (Backfill)'
run-name: 'Revive Streak (${{ github.event.inputs.startDate || github.event.inputs.daysBack || "auto-detect" }})'

on:
  workflow_dispatch:
    inputs:
      startDate:
        description: 'Start date to begin backfilling from (format: YYYY-MM-DD). Leave blank to auto-detect from your previous streak.'
        required: false
        default: ''
      endDate:
        description: 'End date for backfill (format: YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''
      daysBack:
        description: 'Alternative: number of past days to backfill (e.g. 7 or 30). Leave blank if using start date.'
        required: false
        default: ''

jobs:
  revive-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Streak Reviver Loop
        run: node revive.js
        env:
          START_DATE: ${{ github.event.inputs.startDate }}
          END_DATE: ${{ github.event.inputs.endDate }}
          DAYS_BACK: ${{ github.event.inputs.daysBack }}
          TOKEN: ${{ secrets.TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
          token: ${{ secrets.TOKEN }}
          userId: ${{ secrets.USER_ID }}
