name: 'Duolingo Streak Keeper'
run-name: 'Keep Duolingo Streak'

on:
  schedule:
    - cron: '18 23 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Streak Keeper
        run: node xp.js
        env:
          lessonsToComplete: 1
          TOKEN: ${{ secrets.TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
