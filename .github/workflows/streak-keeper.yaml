name: 'Duolingo Streak Keeper'
run-name: 'Keep Duolingo Streak'

on:
  schedule:
    # Slot 1: Morning 06:40 AM (PDT: 13:40 UTC, PST: 14:40 UTC)
    - cron: '40 13 * * *'
    - cron: '40 14 * * *'
    # Slot 2: Afternoon 05:00 PM (PDT: 00:00 UTC, PST: 01:00 UTC)
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    # Slot 3: Evening 08:15 PM (PDT: 03:15 UTC, PST: 04:15 UTC)
    - cron: '15 3 * * *'
    - cron: '15 4 * * *'
    # Hard Limit Cutoff: 09:05 PM (PDT: 04:05 UTC, PST: 05:05 UTC)
    - cron: '5 4 * * *'
    - cron: '5 5 * * *'
    # Safety Net 1: 10:00 PM (PDT: 05:00 UTC, PST: 06:00 UTC)
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    # Safety Net 2: 10:30 PM (PDT: 05:30 UTC, PST: 06:30 UTC)
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'
    # Final Emergency Fallback: 11:15 PM (PDT: 06:15 UTC, PST: 07:15 UTC)
    - cron: '15 6 * * *'
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: false
        default: 'immediate'
        type: choice
        options:
          - immediate
          - random
          - check
      league_checker:
        description: 'Enable League Checker (defends from demotion zone)'
        required: false
        default: true
        type: boolean

jobs:
  run-streak-keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run Streak Keeper
        run: node streak-keeper.js
        env:
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'workflow_dispatch' && 'immediate') || '' }}
          LEAGUE_CHECKER: ${{ github.event.inputs.league_checker || vars.LEAGUE_CHECKER || 'true' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Los_Angeles' }}
          TOKEN: ${{ secrets.TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
