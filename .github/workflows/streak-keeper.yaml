name: 'Duolingo Streak Keeper'
run-name: 'Keep Duolingo Streak'

on:
  schedule:
    # Slot 1: Morning 06:40 AM (PDT: 13:40 UTC, PST: 14:40 UTC)
    - cron: '40 13 * * *'
    - cron: '40 14 * * *'
    # Slot 2: Afternoon 05:00 PM (PDT: 00:00 UTC, PST: 01:00 UTC)
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    # Slot 3: Evening 08:15 PM (PDT: 03:15 UTC, PST: 04:15 UTC)
    - cron: '15 3 * * *'
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: false
        default: 'immediate'
        type: choice
        options:
          - immediate
          - random
          - check

jobs:
  run-streak-keeper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run Streak Keeper
        run: node streak-keeper.js
        env:
          MODE: ${{ github.event.inputs.mode }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Los_Angeles' }}
          TOKEN: ${{ secrets.TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
