name: 'Duolingo Periodic Practice'
run-name: 'Periodic Duolingo Practice'

on:
  workflow_dispatch:
    inputs:
      lessonsToComplete:
        description: 'Amount of practice lessons to complete each time'
        required: true
        default: '1'

  schedule:
    - cron: '*/45 * * * *'

jobs:
  periodic-practice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run XP Script
        run: node xp.js
        env:
          lessonsToComplete: ${{ github.event.inputs.lessonsToComplete }}
          TOKEN: ${{ secrets.TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
