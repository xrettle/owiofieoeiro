name: 'Duolingo Unlimited Hearts'
run-name: 'Enable Unlimited Hearts'

on:
  workflow_dispatch:

jobs:
  enable-hearts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Unlimited Hearts Script
        run: node unlimitedhearts.js
        env:
          TOKEN: ${{ secrets.TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
          token: ${{ secrets.TOKEN }}
          userId: ${{ secrets.USER_ID }}
