name: 'Duolingo XP Farm'
run-name: 'Earn Duolingo XP'

on:
  workflow_dispatch:
    inputs:
      lessonsToComplete:
        description: 'Amount of practice lessons to complete'
        required: true
        default: '5'

jobs:
  farm-xp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run XP Script
        run: node xp.js
        env:
          lessonsToComplete: ${{ github.event.inputs.lessonsToComplete }}
          TOKEN: ${{ secrets.TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
